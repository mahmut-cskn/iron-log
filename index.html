<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c100d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IRON LOG" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <title>IRON LOG — Antrenman günlüğü</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c100d;
        --surface: #151c17;
        --border: #2b372d;
        --accent: #b7ff3c;
        --text: #f2f5ef;
        --muted: #a3afa4;
        --danger: #ffaaaa;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
        min-height: 46px;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 15px;
        background: #202a22;
        color: var(--text);
        font-weight: 650;
      }
      button:hover {
        border-color: #688344;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .primary {
        background: var(--accent);
        color: #152006;
        border-color: var(--accent);
      }
      .danger {
        color: var(--danger);
      }
      .wide {
        width: 100%;
      }
      input,
      select,
      textarea {
        width: 100%;
        min-height: 46px;
        border: 1px solid #3b493d;
        border-radius: 10px;
        background: #0e1510;
        color: var(--text);
        padding: 10px;
      }
      textarea {
        min-height: 90px;
        resize: vertical;
      }
      input[aria-invalid="true"] {
        border-color: var(--danger);
      }
      input:focus,
      textarea:focus,
      select:focus {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      label {
        display: block;
        color: var(--muted);
        font-size: 14px;
      }
      label input,
      label textarea,
      label select {
        margin-top: 5px;
        color: var(--text);
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 28px;
        letter-spacing: -1px;
        font-weight: 900;
      }
      h1 span {
        color: var(--accent);
      }
      h2 {
        font-size: 25px;
        line-height: 1.2;
        letter-spacing: -0.6px;
      }
      h3 {
        font-size: 18px;
      }
      p {
        margin: 8px 0;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 14px;
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 1.8px;
        font-weight: 750;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 9px;
      }
      .app {
        max-width: 880px;
        margin: auto;
        padding: 26px 18px 130px;
      }
      .brand {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
        padding-bottom: 20px;
        margin-bottom: 30px;
      }
      .status {
        font-size: 12px;
        color: var(--muted);
        max-width: 150px;
        text-align: right;
      }
      .status::before {
        content: "● ";
        color: var(--accent);
      }
      .head {
        display: flex;
        gap: 14px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
      }
      .stack {
        display: grid;
        gap: 14px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      .card {
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--surface);
        padding: 20px;
      }
      .template-card {
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .template-card .letter {
        font-size: 64px;
        font-weight: 900;
        line-height: 1;
        color: var(--accent);
        letter-spacing: -5px;
      }
      .template-card p {
        flex: 1;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .between {
        justify-content: space-between;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 16px;
      }
      .empty {
        text-align: center;
        padding: 44px 20px;
        border: 1px dashed var(--border);
        border-radius: 18px;
      }
      .empty .symbol {
        font-size: 36px;
        color: var(--accent);
        margin-bottom: 12px;
      }
      .badge {
        color: var(--accent);
        background: #26351b;
        border: 1px solid #41582a;
        border-radius: 30px;
        padding: 4px 10px;
        font-size: 12px;
        font-weight: 700;
      }
      .section-label {
        margin: 18px 0 10px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1.3px;
        color: var(--muted);
      }
      .previous {
        background: #101712;
        border-left: 2px solid #638f34;
        border-radius: 8px;
        padding: 12px;
        font-size: 14px;
      }
      .previous p {
        margin: 2px 0;
      }
      .progress-card {
        position: sticky;
        top: 0;
        z-index: 2;
        background: #18221a;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 14px;
        margin-bottom: 18px;
      }
      .progress {
        height: 7px;
        background: #334036;
        border-radius: 9px;
        overflow: hidden;
        margin-top: 10px;
      }
      .progress > div {
        height: 100%;
        background: var(--accent);
      }
      details.exercise {
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        overflow: hidden;
      }
      summary {
        cursor: pointer;
        list-style: none;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 17px;
        min-height: 80px;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      summary::after {
        content: "＋";
        color: var(--muted);
        margin-left: auto;
      }
      details[open] > summary::after {
        content: "−";
      }
      .icon {
        font-size: 23px;
        background: #253026;
        border-radius: 12px;
        min-width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
      }
      .exercise-title {
        flex: 1;
        min-width: 0;
      }
      .exercise-title strong {
        display: block;
      }
      .check {
        color: var(--accent);
      }
      .exercise-body {
        padding: 0 16px 18px;
        border-top: 1px solid var(--border);
      }
      .set-row {
        display: flex;
        gap: 8px;
        align-items: end;
        padding: 10px 8px;
        border-radius: 10px;
        margin-bottom: 6px;
        background: #101712;
      }
      .set-row.done {
        background: #23331c;
        box-shadow: inset 2px 0 var(--accent);
      }
      .set-number {
        align-self: center;
        font-size: 12px;
        color: var(--muted);
        width: 28px;
        flex-shrink: 0;
      }
      .set-fields {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(65px, 1fr));
        flex: 1;
        gap: 7px;
        min-width: 0;
      }
      .set-fields label {
        font-size: 12px;
      }
      .set-fields input {
        padding: 8px;
        min-width: 0;
      }
      .tick,
      .remove-set {
        padding: 8px;
        min-width: 44px;
        flex-shrink: 0;
      }
      .tick[aria-pressed="true"] {
        background: var(--accent);
        color: #142009;
      }
      .remove-set {
        color: var(--danger);
      }
      .set-row.history-edit {
        flex-wrap: wrap;
      }
      .note {
        margin-top: 14px;
      }
      .nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 5;
        background: #111912f5;
        border-top: 1px solid var(--border);
        padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      }
      .nav-inner {
        max-width: 680px;
        margin: auto;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
      }
      .nav button {
        background: transparent;
        border: 0;
        color: var(--muted);
        padding: 7px 2px;
        font-size: 11px;
        font-weight: 550;
      }
      .nav button span {
        display: block;
        font-size: 21px;
        line-height: 24px;
        margin-bottom: 3px;
      }
      .nav button.active {
        color: var(--accent);
        background: #25301c;
      }
      .notice {
        padding: 12px 16px;
        border: 1px solid #887647;
        background: #302b19;
        border-radius: 12px;
        margin-bottom: 16px;
        font-size: 14px;
      }
      .history-item {
        width: 100%;
        text-align: left;
        padding: 18px;
        background: var(--surface);
        border-radius: 15px;
      }
      .history-item strong {
        font-size: 18px;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .span-2 {
        grid-column: 1/-1;
      }
      dialog {
        color: var(--text);
        background: var(--surface);
        border: 1px solid #4b6045;
        border-radius: 20px;
        padding: 24px;
        width: calc(100% - 28px);
        max-width: 600px;
        max-height: 88dvh;
        overflow: auto;
      }
      dialog::backdrop {
        background: #000b;
      }
      dialog h2 {
        margin-bottom: 14px;
      }
      dialog .actions {
        justify-content: flex-end;
      }
      .template-entry {
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        margin-top: 12px;
      }
      .template-entry .row button {
        padding: 8px;
        min-width: 44px;
      }
      .readonly-set {
        border-bottom: 1px solid var(--border);
        padding: 9px 0;
      }
      .preline {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #toast {
        position: fixed;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--accent);
        color: #152006;
        border-radius: 10px;
        padding: 12px 18px;
        z-index: 20;
        max-width: 90%;
        box-shadow: 0 5px 30px #0006;
      }
      #toast:empty {
        display: none;
      }
      .footer-note {
        color: var(--muted);
        font-size: 13px;
        margin-top: 22px;
      }
      @media (max-width: 600px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .app {
          padding: 20px 14px 120px;
        }
        .brand {
          margin-bottom: 24px;
        }
        .template-card {
          gap: 12px;
        }
        .template-card .letter {
          font-size: 48px;
        }
        .head {
          align-items: flex-start;
        }
        .card {
          padding: 17px;
        }
        .form-grid {
          gap: 10px;
        }
        .set-row {
          gap: 5px;
          padding: 8px 5px;
        }
        .exercise-body {
          padding: 0 10px 14px;
        }
        h2 {
          font-size: 23px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
        }
      }
      .recommendation {
        border-color: #638f34;
        margin-bottom: 24px;
        background: #192619;
      }
      .recommendation ul {
        padding-left: 22px;
        color: var(--muted);
        margin: 16px 0;
      }
      .recommendation li {
        margin: 8px 0;
      }
      .recommendation li::marker {
        color: var(--accent);
      }
      .metadata-editor {
        margin-top: 16px;
      }
      .metadata-editor fieldset {
        border: 1px solid var(--border);
        border-radius: 12px;
        margin: 14px 0;
        padding: 10px;
        min-width: 0;
      }
      .metadata-editor legend {
        font-size: 14px;
        color: var(--muted);
      }
      .muscle-options {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }
      .muscle-options label {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        color: var(--text);
      }
      .muscle-options input {
        width: 20px;
        min-height: 20px;
        height: 20px;
        margin: 0;
        accent-color: var(--accent);
      }
    </style>
  </head>

        function calendarDayNumber(date) {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return NaN;
          const [year, month, day] = date.split("-").map(Number);
          // UTC is only used to count LOCAL calendar dates; DST never creates 23h days.
          const utc = new Date(0);

          return calendarDayNumber(today) - calendarDayNumber(date);

          const sets = session.results.flatMap((r) => r.sets);
          return sets.length
            ? sets.filter((s) => s.done).length / sets.length
            : 0;
        }
        function getCompletedSessions(sessions, today = localDate()) {
          return sessions
            .filter(
              (s) =>
                s.status === "completed" &&
                getDaysSince(s.date, today) >= 0 &&
                getSessionCompletionRatio(s) > 0,
            )
            .slice()
            .sort(
              (a, b) =>
                b.date.localeCompare(a.date) ||
                (b.completedAt || "").localeCompare(a.completedAt || "") ||
                a.id.localeCompare(b.id),

            const age = getDaysSince(s.date, today),
              decay = LOAD_DECAY[age] || 0;

            const m = sessionMetadata(s),
              scale =
                getSessionCompletionRatio(s) *
                decay *
                (m.intensity === "hard" ? HARD_MODE_MULTIPLIER : 1);

                age >= 7 ||

        function buildRecommendationContext(source, today = localDate()) {

          a.click();

        function coachReport(from, to) {
          const sessions = state.sessions
            .filter(
              (s) =>
                s.status === "completed" &&
                (!from || s.date >= from) &&
                (!to || s.date <= to),
            )
            .sort(
              (a, b) =>
                a.date.localeCompare(b.date) ||
                (a.completedAt || "").localeCompare(b.completedAt || ""),
            );
          const lines = [
            "IRON LOG TRAINING REPORT",
            `Date range: ${from || sessions[0]?.date || "—"} - ${to || sessions.at(-1)?.date || "—"}`,
            `Workout sessions: ${sessions.length}`,
            "Units: kg; assistance = destek (daha düşük destek = daha az yardım); duration = seconds; distance = meters.",
            "✓ = completed; ○ = incomplete",
            "",
          ];
          const grouped = new Map();
          sessions.forEach((s) =>
            s.results.forEach((r) => {
              if (!grouped.has(r.exerciseId)) grouped.set(r.exerciseId, []);
              grouped.get(r.exerciseId).push({ s, r });
            }),
          );
          for (const list of grouped.values()) {
            lines.push(list.at(-1).r.exercise.name.toUpperCase(), "");
            for (const { s, r } of list) {
              lines.push(
                `${s.date} | ${s.templateName}`,
                `Exercise: ${r.exercise.name} | Type: ${r.exercise.type}`,
                `Target: ${r.target}`,
                ...r.sets.map(
                  (set, i) =>
                    `${set.done ? "✓" : "○"} Set ${i + 1}: ${formatSet(set, r.exercise.type)}`,
                ),
              );
              if (r.notes) lines.push("Notes: " + r.notes);
              lines.push("");
            }
          }
          lines.push("WORKOUT NOTES");
          sessions.forEach((s) =>
            lines.push(
              `${s.date} | ${s.templateName}`,
              s.notes || "(No workout note)",
              "",
            ),
          );
          return lines.join("\n");
        }
        async function importBackup(file) {

            const incoming = validateData(JSON.parse(await file.text()));
            if (
              !(await confirmModal(
                "Tüm verileri değiştir",
                `Bu yedekte ${incoming.sessions.length} antrenman, ${incoming.templates.length} program var. Mevcut tüm programlar, hareketler ve antrenmanlar (aktif kayıt dahil) değiştirilecek. Bu işlem geri alınamaz. Önce mevcut JSON yedeğini indirdiğinden emin ol.`,

                true,

            Storage.importData(incoming);
            state = incoming;

            ui.open.clear();
            ui.editing = false;
            loadWarning = "";
            document.getElementById("warning").innerHTML = "";

        function confirmModal(
          title,
          message,
          label = "Onayla",
          danger = false,
        ) {
          return new Promise((resolve) => {
            showModal(
              `<h2>${esc(title)}</h2><p>${esc(message)}</p><div class="actions"><button id="confirm-no" autofocus>Vazgeç</button><button id="confirm-yes" class="${danger ? "danger" : "primary"}">${esc(label)}</button></div>`,
            );
            let resolved = false;
            const done = (value) => {
              if (resolved) return;
              resolved = true;
              modal.removeEventListener("cancel", cancel);
              modal.removeEventListener("close", closed);
              closeModal();
              resolve(value);
            };
            const cancel = (e) => {
              e.preventDefault();
              done(false);
            };
            const closed = () => done(false);
            modal.addEventListener("cancel", cancel);
            modal.addEventListener("close", closed);
            document.getElementById("confirm-no").onclick = () => done(false);
            document.getElementById("confirm-yes").onclick = () => done(true);
          });
        }

        // ==================== EVENT HANDLERS ====================

        document.addEventListener(
          "toggle",
          (event) => {

              const id = event.target.dataset.result;
              if (event.target.open) ui.open.add(id);
              else ui.open.delete(id);
            }
          },
          true,
        );
        document.addEventListener("input", (event) => {
          const el = event.target,
            d = el.dataset,
            s = currentSession();
          if (d.setField && s) {
            const r = s.results.find((r) => r.id === d.resultId),
              set = r.sets.find((x) => x.id === d.setId);
            if (!el.validity.valid) {
              el.setAttribute("aria-invalid", "true");
              setSaveStatus("Geçersiz giriş · kaydedilmedi");
              return;
            }
            el.removeAttribute("aria-invalid");
            set[d.setField] = el.value === "" ? null : Number(el.value);
            if (set.done && !validateSet(set, r.exercise.type)) {
              set.done = false;
              const row = el.closest(".set-row");
              row.classList.remove("done");
              row.querySelector(".tick").setAttribute("aria-pressed", "false");
            }
            persist();
            updateWorkoutProgress();
            return;
          }
          if (d.resultNote && s) {
            s.results.find((r) => r.id === d.resultNote).notes = el.value;
            persist();
          }
          if (d.sessionField && s) {
            if (d.sessionField === "date") {
              if (!el.value || !el.validity.valid) return;
              for (const k of ["startedAt", "completedAt"])
                if (s[k])
                  s[k] = new Date(
                    `${el.value}T${localTime(s[k])}`,
                  ).toISOString();
            }
            s[d.sessionField] = el.value;
            persist();

          if (d.sessionTime && s) {

              if (d.sessionTime === "startedAt" || s.status === "draft")
                s[d.sessionTime] = null;
              else {
                el.value = localTime(s.completedAt);
                toast("Tamamlanan kaydın bitiş saati boş olamaz.");
                return;
              }
            } else
              s[d.sessionTime] = new Date(
                `${s.date}T${el.value}`,
              ).toISOString();
            persist();
          }
          if (el.closest("#template-form")) {
            if (el.name === "name") ui.templateDraft.name = el.value;
            if (el.name === "intensity") ui.templateDraft.intensity = el.value;
            if (d.muscleRole) {
              const groups = ui.templateDraft.muscleGroups;
              groups[d.muscleRole] = Array.from(
                el
                  .closest("form")
                  .querySelectorAll(
                    `[data-muscle-role="${d.muscleRole}"]:checked`,
                  ),
              ).map((input) => input.value);
              if (el.checked) {
                const other =
                  d.muscleRole === "primary" ? "secondary" : "primary";
                groups[other] = groups[other].filter((g) => g !== el.value);
                el
                  .closest("form")
                  .querySelector(
                    `[data-muscle-role="${other}"][value="${el.value}"]`,
                  ).checked = false;
              }
            }
            if (d.entry !== undefined) {
              const entry = ui.templateDraft.exercises[Number(d.entry)];
              entry[d.entryField] =
                d.entryField === "sets" ? Number(el.value) : el.value;
            }
          }
        });
        function updateWorkoutProgress() {
          const s = currentSession();
          if (!s) return;
          const p = document.getElementById("workout-progress");
          if (p) p.innerHTML = progressHTML(s);
          document.querySelectorAll("details[data-result]").forEach((card) => {
            const r = s.results.find((r) => r.id === card.dataset.result);
            if (r)
              card.querySelector("[data-card-check]").textContent =
                r.sets.length && r.sets.every((x) => x.done) ? "✓" : "";
          });
        }
        document.addEventListener("change", (e) => {
          if (e.target.id === "import-file") importBackup(e.target.files[0]);
        });
        document.addEventListener("click", async (event) => {
          const b = event.target.closest("button");
          if (!b) return;
          if (b.dataset.nav) {
            ui.page = b.dataset.nav;
            ui.editing = false;
            ui.sessionId = null;
            render();
            window.scrollTo(0, 0);
            return;
          }
          const a = b.dataset.action,
            id = b.dataset.id;
          if (!a) return;
          const s = currentSession();
          switch (a) {
            case "start":
              startWorkout(id);
              break;
            case "finish":
              await finishWorkout();
              break;
            case "close-modal":
              closeModal();
              break;
            case "toggle-set": {
              const r = s.results.find((x) => x.id === b.dataset.resultId),
                set = r.sets.find((x) => x.id === b.dataset.setId);
              const row = b.closest(".set-row");
              if (
                !set.done &&
                (!validateSet(set, r.exercise.type) ||
                  Array.from(row.querySelectorAll("input")).some(
                    (x) => !x.validity.valid,
                  ))
              ) {
                toast(
                  "Seti tamamlamak için geçerli sonuç gir. Kardiyoda süre veya mesafe yeterli.",
                );
                return;
              }
              set.done = !set.done;
              persist();
              row.classList.toggle("done", set.done);
              b.setAttribute("aria-pressed", String(set.done));
              b.setAttribute(
                "aria-label",
                set.done ? "Set tamamlanmasını geri al" : "Seti tamamla",
              );
              updateWorkoutProgress();
              break;
            }
            case "add-set": {
              const r = s.results.find((x) => x.id === b.dataset.resultId);
              if (r.sets.length >= 100) {
                toast("En fazla 100 set eklenebilir.");
                return;
              }
              r.sets.push(blankSet());
              persist();
              rerenderSession();
              break;
            }
            case "remove-set": {
              const r = s.results.find((x) => x.id === b.dataset.resultId);
              if (
                !(await confirmModal(
                  "Seti sil",
                  "Bu set ve girdiğin sonuçları silinsin mi?",
                  "Seti sil",
                  true,
                ))
              )
                return;
              r.sets = r.sets.filter((x) => x.id !== b.dataset.setId);
              persist();
              rerenderSession();
              break;
            }
            case "manual":
              openManualSession();
              break;
            case "session":
              ui.editing = false;
              renderSessionDetails(id);
              break;
            case "back-history":
              ui.sessionId = null;
              ui.editing = false;
              renderHistory();
              break;
            case "edit-history":
              ui.editing = true;
              renderSessionDetails(s.id);
              break;
            case "save-history":
              if (!validateVisibleInputs()) return;
              if (s.status === "draft") {
                s.status = "completed";
                s.completedAt =
                  s.completedAt ||
                  new Date(
                    `${s.date}T${localTime(new Date().toISOString())}`,
                  ).toISOString();
              }
              persist();
              ui.editing = false;
              renderSessionDetails(s.id);
              toast("Geçmiş kaydı kaydedildi.");
              break;
            case "delete-session":
              if (
                await confirmModal(
                  "Antrenmanı sil",
                  "Bu antrenman kaydı kalıcı olarak silinecek.",
                  "Kaydı sil",
                  true,
                )
              ) {
                state.sessions = state.sessions.filter((x) => x.id !== s.id);
                persist();
                ui.sessionId = null;
                ui.editing = false;
                renderHistory();
              }
              break;
            case "new-template":
              openTemplateEditor();
              break;
            case "edit-template":
              openTemplateEditor(id);
              break;
            case "delete-template":
              if (
                await confirmModal(
                  "Programı sil",
                  "Program silinecek. Geçmiş ve aktif antrenman kayıtları korunacak.",
                  "Programı sil",
                  true,
                )
              ) {
                state.templates = state.templates.filter((x) => x.id !== id);
                persist();
                renderTemplates();
              }
              break;
            case "add-entry": {
              const e = state.exercises.find(
                (x) =>
                  x.id === document.getElementById("exercise-choice").value,
              );
              if (!e) return;
              ui.templateDraft.exercises.push({
                id: uid(),
                exerciseId: e.id,
                sets: e.defaultSets,
                target: defaultTarget(e),
              });
              renderTemplateEditor();
              break;
            }
            case "remove-entry":
              ui.templateDraft.exercises.splice(Number(b.dataset.index), 1);
              renderTemplateEditor();
              break;
            case "move-entry": {
              const i = Number(b.dataset.index),
                j = i + Number(b.dataset.delta),
                list = ui.templateDraft.exercises;
              [list[i], list[j]] = [list[j], list[i]];
              renderTemplateEditor();
              break;
            }
            case "new-exercise":
              openExerciseEditor();
              break;
            case "edit-exercise":
              openExerciseEditor(id);
              break;
            case "delete-exercise": {
              const count = state.templates.filter((t) =>
                t.exercises.some((r) => r.exerciseId === id),
              ).length;
              if (
                await confirmModal(
                  "Hareketi sil",
                  `Hareket kütüphaneden ve kullanıldığı ${count} programdan kaldırılacak. Geçmiş ve aktif antrenman snapshot’ları korunacak.`,
                  "Hareketi sil",
                  true,
                )
              ) {
                state.exercises = state.exercises.filter((e) => e.id !== id);
                state.templates.forEach(
                  (t) =>
                    (t.exercises = t.exercises.filter(
                      (r) => r.exerciseId !== id,
                    )),
                );
                persist();
                renderExercises();
              }
              break;
            }
            case "export-json":
              download(
                `iron-log-backup-${localDate()}.json`,
                Storage.exportData(),
                "application/json",
              );
              break;
            case "export-raw":
              try {
                download(
                  `iron-log-raw-${localDate()}.json`,
                  Storage.rawData(),
                  "application/json",
                );
              } catch (error) {
                toast(error.message);
              }
              break;
          }
        });
        document.addEventListener("submit", (event) => {
          event.preventDefault();
          const form = event.target,
            f = new FormData(form);
          switch (form.id) {
            case "template-form": {
              const t = ui.templateDraft;
              t.name = f.get("name").trim();
              if (
                !t.name ||
                t.exercises.some(
                  (r) =>
                    !Number.isInteger(r.sets) || r.sets < 1 || r.sets > 100,
                )
              ) {
                toast("Program adı ve 1–100 arasında set sayısı gerekli.");
                return;
              }
              const i = state.templates.findIndex((x) => x.id === t.id);
              if (i < 0) state.templates.push(clone(t));
              else state.templates[i] = clone(t);
              persist();
              closeModal();
              renderTemplates();
              break;
            }
            case "exercise-form": {
              const rep = (n) => (f.get(n) === "" ? null : Number(f.get(n)));
              const type = f.get("type"),
                hasReps = FIELDS[type].some(([key]) => key === "reps");
              const e = {
                id: ui.exerciseId || uid(),
                name: f.get("name").trim(),
                icon: f.get("icon").trim() || "🏋️",
                type,
                defaultSets: Number(f.get("defaultSets")),
                minReps: hasReps ? rep("minReps") : null,
                maxReps: hasReps ? rep("maxReps") : null,
                notes: f.get("notes"),
              };
              if (
                !e.name ||
                (e.minReps !== null &&
                  e.maxReps !== null &&
                  e.minReps > e.maxReps)
              ) {
                toast("Adı ve tekrar aralığını kontrol et.");
                return;
              }
              const i = state.exercises.findIndex((x) => x.id === e.id);
              if (i < 0) state.exercises.push(e);
              else state.exercises[i] = e;
              persist();
              closeModal();
              renderExercises();
              break;
            }
            case "manual-form": {
              const template = state.templates.find(
                (t) => t.id === f.get("template"),
              );
              const s = createSession(template, f.get("date"), true);
              state.sessions.push(s);
              persist();
              closeModal();
              ui.page = "history";
              ui.editing = true;
              renderSessionDetails(s.id);
              break;
            }
            case "coach-form": {
              const from = f.get("from"),
                to = f.get("to");
              if (from && to && from > to) {
                toast("Başlangıç tarihi bitişten sonra olamaz.");
                return;
              }
              download(
                `iron-log-coach-${localDate()}.txt`,
                coachReport(from, to),
                "text/plain;charset=utf-8",
              );
              break;
            }
          }
        });
        if (loadWarning)
          document.getElementById("warning").innerHTML =
            `<div class="notice" role="alert">${esc(loadWarning)}</div>`;
        if (legacyCount)
          toast(
            `${legacyCount} eski kayıt aktarıldı. History bölümünden kontrol edebilirsin.`,
          );
        Object.defineProperty(window, "IronLogDebug", {
          configurable: true,
          value: Object.freeze({
            recommendation: () =>
              getWorkoutRecommendation(state, localDate(), true),
          }),
        });
        render();
        if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
          navigator.serviceWorker.register('service-worker.js').catch(error => console.error('Offline mode could not start:', error));
        }
      })();
    </script>
  </body>
</html>
